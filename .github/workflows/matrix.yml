# A matrix, a checkout and setup-node.
name: matrix
on:
  pull_request:
    paths: ['src/**']
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
